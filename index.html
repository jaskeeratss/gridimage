<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3:4 Micro-Tile Grid Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #090d16;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 6px 0;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0 0 20px 0;
        }

        .card {
            background: #131c2e;
            border: 1px solid #1e293b;
            padding: 18px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            align-items: end;
            margin-bottom: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }

        input,
        select {
            background: #0a0f1d;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        button {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            height: 38px;
        }

        button:disabled {
            background: #1e293b;
            color: #64748b;
            cursor: not-allowed;
        }

        #status {
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 16px;
            min-height: 18px;
        }

        .preview {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: 520px;
        }

        canvas {
            max-width: 100%;
            max-height: 480px;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <h1>Micro-Tile Grid Generator (3:4)</h1>
        <p>Generates high-density repeating photo grids in browser.</p>

        <div class="card">
            <div class="field">
                <label>Photo</label>
                <input type="file" id="fileIn" accept="image/*">
            </div>

            <div class="field">
                <label>Tile Count (3:4)</label>
                <select id="tilePreset">
                    <option value="150x200">30,000 tiles (150×200)</option>
                    <option value="50x60">3,000 tiles (50×60)</option>
                    <option value="45x60">2,700 tiles (45×60)</option>
                </select>
            </div>

            <div class="field">
                <label>Canvas Size</label>
                <select id="canvasRes">
                    <option value="4500x6000" selected>4500 × 6000 (Print)</option>
                    <option value="3000x4000">3000 × 4000 (HD)</option>
                    <option value="1500x2000">1500 × 2000 (Fast)</option>
                </select>
            </div>

            <button id="runBtn" disabled>Generate & Save</button>
        </div>

        <div id="status">Select an image to start.</div>

        <div class="preview">
            <canvas id="viewCanvas"></canvas>
        </div>
    </div>

    <script>
        const fileIn = document.getElementById('fileIn');
        const tilePreset = document.getElementById('tilePreset');
        const canvasRes = document.getElementById('canvasRes');
        const runBtn = document.getElementById('runBtn');
        const status = document.getElementById('status');
        const viewCanvas = document.getElementById('viewCanvas');
        const viewCtx = viewCanvas.getContext('2d');

        let img = null;

        fileIn.addEventListener('change', (e) => {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                img = new Image();
                img.onload = () => {
                    status.innerText = `Loaded: ${img.width}x${img.height}px. Ready.`;
                    runBtn.disabled = false;
                    viewCanvas.width = 300;
                    viewCanvas.height = 400;
                    viewCtx.drawImage(img, 0, 0, 300, 400);
                };
                img.src = ev.target.result;
            };
            r.readAsDataURL(f);
        });

        runBtn.addEventListener('click', async () => {
            if (!img) return;
            runBtn.disabled = true;

            const [cols, rows] = tilePreset.value.split('x').map(Number);
            const [cW, cH] = canvasRes.value.split('x').map(Number);
            const tileW = Math.round(cW / cols);
            const tileH = Math.round(cH / rows);

            status.innerText = `Rendering ${cols * rows} tiles...`;
            await new Promise(r => setTimeout(r, 40));

            try {
                // 1. Offscreen micro-tile
                const tCanvas = document.createElement('canvas');
                tCanvas.width = tileW;
                tCanvas.height = tileH;
                const tCtx = tCanvas.getContext('2d');
                tCtx.drawImage(img, 0, 0, tileW, tileH);

                // 2. High-res render canvas
                const out = document.createElement('canvas');
                out.width = cW;
                out.height = cH;
                const outCtx = out.getContext('2d');
                const pattern = outCtx.createPattern(tCanvas, 'repeat');
                outCtx.fillStyle = pattern;
                outCtx.fillRect(0, 0, cW, cH);

                // 3. Update preview
                viewCanvas.width = cW;
                viewCanvas.height = cH;
                viewCtx.drawImage(out, 0, 0);

                // 4. Download
                status.innerText = 'Exporting file...';
                out.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `grid_${cols * rows}_tiles.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    status.innerText = `Saved ${cols * rows} tiles at ${cW}x${cH}!`;
                    runBtn.disabled = false;
                }, 'image/jpeg', 0.96);

            } catch (err) {
                status.innerText = 'Memory error. Switch to 3000x4000 canvas.';
                runBtn.disabled = false;
            }
        });
    </script>

</body>

</html>
