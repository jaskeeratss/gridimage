<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro-Tile Grid Generator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #090d16;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wrapper {
      width: 100%;
      max-width: 900px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 6px 0;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin: 0 0 20px 0;
    }
    .card {
      background: #131c2e;
      border: 1px solid #1e293b;
      padding: 18px;
      border-radius: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      align-items: end;
      margin-bottom: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
    }
    input, select {
      background: #0a0f1d;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      height: 38px;
    }
    button:disabled {
      background: #1e293b;
      color: #64748b;
      cursor: not-allowed;
    }
    #status {
      font-size: 13px;
      color: #38bdf8;
      margin-bottom: 16px;
      min-height: 18px;
    }
    .preview {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 520px;
    }
    canvas {
      max-width: 100%;
      max-height: 480px;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <h1>Micro-Tile Grid Generator</h1>
  <p>Generate high-density repeating photo grids directly in your browser.</p>

  <div class="card">
    <div class="field">
      <label>1. Photo</label>
      <input type="file" id="fileIn" accept="image/*">
    </div>

    <div class="field">
      <label>2. Canvas Size & Ratio</label>
      <select id="canvasRes">
        <!-- 3:4 Ratios -->
        <optgroup label="3:4 Poster / Print">
          <option value="4500x6000" selected>4500 × 6000 (3:4 Extreme Print)</option>
          <option value="3000x4000">3000 × 4000 (3:4 Ultra HD)</option>
          <option value="1500x2000">1500 × 2000 (3:4 Fast HD)</option>
          <option value="900x1200">900 × 1200 (3:4 Lightweight)</option>
        </optgroup>
        <!-- Phone / 9:16 Ratios -->
        <optgroup label="9:16 Fullscreen Mobile">
          <option value="1125x2436">1125 × 2436 (iPhone X / XS Screen)</option>
          <option value="1080x1920">1080 × 1920 (Standard Reel / Story)</option>
          <option value="1440x3200">1440 × 3200 (2K Tall Mobile)</option>
        </optgroup>
        <!-- Instagram / Social -->
        <optgroup label="Social Post Formats">
          <option value="1080x1350">1080 × 1350 (4:5 Portrait Post)</option>
          <option value="2048x2048">2048 × 2048 (1:1 Square Hi-Res)</option>
          <option value="1080x1080">1080 × 1080 (1:1 Square Standard)</option>
        </optgroup>
        <!-- Ultra Large -->
        <optgroup label="Ultra-Large Poster">
          <option value="6000x8000">6000 × 8000 (48MP Master)</option>
        </optgroup>
      </select>
    </div>

    <div class="field">
      <label>3. Tile Density</label>
      <select id="tilePreset">
        <option value="custom">Custom Tile Count</option>
        <option value="500">500 tiles (Minimal / Large tiles)</option>
        <option value="1200">1,200 tiles</option>
        <option value="3000">3,000 tiles (Clear miniatures)</option>
        <option value="5000">5,000 tiles</option>
        <option value="10000">10,000 tiles (Very dense)</option>
        <option value="20000">20,000 tiles</option>
        <option value="30000" selected>30,000 tiles (Exact micro-texture)</option>
        <option value="50000">50,000 tiles</option>
        <option value="100000">100,000 tiles (Ultra microscopic)</option>
      </select>
    </div>

    <div class="field" id="customTileWrapper" style="display: none;">
      <label>Custom Count</label>
      <input type="number" id="customTileInput" value="30000" min="10" max="250000">
    </div>

    <button id="runBtn" disabled>Generate & Save</button>
  </div>

  <div id="status">Select an image to start.</div>

  <div class="preview">
    <canvas id="viewCanvas"></canvas>
  </div>
</div>

<script>
  const fileIn = document.getElementById('fileIn');
  const tilePreset = document.getElementById('tilePreset');
  const customTileWrapper = document.getElementById('customTileWrapper');
  const customTileInput = document.getElementById('customTileInput');
  const canvasRes = document.getElementById('canvasRes');
  const runBtn = document.getElementById('runBtn');
  const status = document.getElementById('status');
  const viewCanvas = document.getElementById('viewCanvas');
  const viewCtx = viewCanvas.getContext('2d');

  let img = null;

  tilePreset.addEventListener('change', () => {
    customTileWrapper.style.display = tilePreset.value === 'custom' ? 'flex' : 'none';
  });

  fileIn.addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = (ev) => {
      img = new Image();
      img.onload = () => {
        status.innerText = `Loaded: ${img.width}×${img.height}px. Ready to generate.`;
        runBtn.disabled = false;
        viewCanvas.width = 300;
        viewCanvas.height = 400;
        viewCtx.drawImage(img, 0, 0, 300, 400);
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
  });

  runBtn.addEventListener('click', async () => {
    if (!img) return;
    runBtn.disabled = true;

    const [cW, cH] = canvasRes.value.split('x').map(Number);
    const targetTotal = tilePreset.value === 'custom'
      ? Math.max(1, parseInt(customTileInput.value, 10) || 3000)
      : parseInt(tilePreset.value, 10);

    // Calculate grid dimensions matching aspect ratio
    const aspect = cW / cH;
    let cols = Math.max(1, Math.round(Math.sqrt(targetTotal * aspect)));
    let rows = Math.max(1, Math.round(targetTotal / cols));
    const exactTotal = cols * rows;

    const tileW = cW / cols;
    const tileH = cH / rows;

    status.innerText = `Rendering ${exactTotal.toLocaleString()} tiles (${cols} cols × ${rows} rows)...`;
    await new Promise(r => setTimeout(r, 40));

    try {
      // 1. Offscreen micro-tile
      const tCanvas = document.createElement('canvas');
      tCanvas.width = Math.max(1, Math.round(tileW));
      tCanvas.height = Math.max(1, Math.round(tileH));
      const tCtx = tCanvas.getContext('2d');
      tCtx.drawImage(img, 0, 0, tCanvas.width, tCanvas.height);

      // 2. High-res render canvas
      const out = document.createElement('canvas');
      out.width = cW;
      out.height = cH;
      const outCtx = out.getContext('2d');
      const pattern = outCtx.createPattern(tCanvas, 'repeat');
      outCtx.fillStyle = pattern;
      outCtx.fillRect(0, 0, cW, cH);

      // 3. Update preview
      viewCanvas.width = cW;
      viewCanvas.height = cH;
      viewCtx.drawImage(out, 0, 0);

      // 4. Download
      status.innerText = 'Exporting file...';
      out.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `grid_${exactTotal}_tiles_${cW}x${cH}.jpg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        status.innerText = `Saved ${exactTotal.toLocaleString()} tiles at ${cW}×${cH}!`;
        runBtn.disabled = false;
      }, 'image/jpeg', 0.96);

    } catch (err) {
      status.innerText = 'Browser ran out of memory. Try a lower resolution preset like 3000×4000.';
      runBtn.disabled = false;
    }
  });
</script>

</body>
</html>
